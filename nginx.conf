server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # O Vite põe hash no nome de cada asset, então o conteúdo de um arquivo com
  # esse nome nunca muda — pode ficar em cache indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O index.html é o oposto: é ele que aponta para o bundle novo a cada deploy.
  # Se ficar em cache, o navegador continua carregando a versão antiga.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
