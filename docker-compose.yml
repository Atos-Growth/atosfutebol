# As variáveis vêm do .env desta pasta na VPS (não versionado).
services:
  atosfutebol-web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?defina no .env da VPS}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?defina no .env da VPS}
    image: atosfutebol-web
    container_name: atosfutebol-web
    restart: unless-stopped
    # Sem porta publicada no host: quem entrega o app é o Nginx Proxy Manager,
    # que alcança este container pelo nome dentro da npm_network. Mesmo padrão
    # do app-tenis-web e do controle-faturamento-web.
    networks:
      - npm_network

networks:
  npm_network:
    external: true
